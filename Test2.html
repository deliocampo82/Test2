<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tracking Runners">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Tracking Runners</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--s1:#121212;--s2:#1c1c1c;--line:#2a2a2a;--ink:#f4f4f4;--mute:#8d8d8d;--acc:#ff6b1a;--accInk:#000;--good:#5fe08a;--bad:#ff6b6b;color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 Sora,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
.wrap{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px 120px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--acc);color:#000;display:grid;place-items:center;flex:none}
.brand b{display:block;font-weight:800;font-size:15px;letter-spacing:-.01em}
.brand small{display:block;color:var(--mute);font-size:12px}
.hd{margin-bottom:16px}
.hd small{display:block;color:var(--mute);font-size:12px}
.hd h1{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--s1);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--ink)}
.pill.o{border-color:var(--acc);color:var(--acc)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.card.hi{border-color:var(--acc)}
.lbl{color:var(--mute);font-size:12px}
.num{font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.goal{display:flex;align-items:center;gap:16px}
.goal .info{flex:1}
.goal .big{font-size:32px;line-height:1.1;margin-top:2px}
.goal .big span{font-size:14px;color:var(--mute);font-weight:600;margin-left:4px;letter-spacing:0}
.goal .ok{font-size:13px;margin-top:6px;color:var(--acc);font-weight:600}
.ring{position:relative;width:92px;height:92px;flex:none}
.ring svg{transform:rotate(-90deg);display:block}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:19px;font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px}
.tile .v{font-size:26px;margin-top:4px;line-height:1.1}
.tile .v i{font-style:normal;font-size:12px;color:var(--mute);font-weight:600;margin-left:3px;letter-spacing:0}
.tile.o .v{color:var(--acc)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 10px}
.sec h2{font-size:15px;font-weight:600}
.sec span{color:var(--mute);font-size:12px}
.chart{display:block;width:100%;height:auto}
.map{display:block;width:100%;height:auto;max-height:84px;margin:10px 0 6px;filter:drop-shadow(0 0 6px rgba(255,107,26,.45))}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.stats3>div{text-align:center}
.stats3>div+div{border-left:1px solid var(--line)}
.stats3 .v{font-size:18px;margin-top:2px;font-weight:800;font-variant-numeric:tabular-nums}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:16px;padding:16px;background:var(--acc);color:var(--accInk);font:800 15px Sora,system-ui,sans-serif;cursor:pointer;margin-top:10px}
.btn.g{background:var(--s1);color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn:focus-visible,.nav button:focus-visible,input:focus-visible,.stop:focus-visible,.back:focus-visible{outline:3px solid #fff;outline-offset:2px}
.cta{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:4;margin-top:18px}
.cta .btn{margin:0;box-shadow:0 10px 30px rgba(255,107,26,.3)}
.rw{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.rw:last-child{border-bottom:0;padding-bottom:0}
.rw:first-child{padding-top:0}
.rw .nm{flex:1;font-weight:600}
.rw .nm .lbl{font-weight:400}
.rw .tm{font-weight:800;font-variant-numeric:tabular-nums}
.pos{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--s2);color:var(--mute);flex:none}
.rw.k .pos{background:var(--acc);color:#000}
.rw.k .tm{color:var(--acc)}
.rw.me .nm::after{content:"você";margin-left:8px;font-size:11px;color:var(--acc);border:1px solid var(--acc);border-radius:99px;padding:1px 7px;font-weight:600}
.king{display:flex;align-items:center;gap:8px;margin:6px 0 2px;font-weight:600}
.king svg{color:var(--acc);flex:none}
.king .tm{margin-left:auto;color:var(--acc);font-weight:800;font-variant-numeric:tabular-nums}
.top2{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.top2 h3{font-size:17px;font-weight:800;letter-spacing:-.01em}
.back{background:none;border:0;color:var(--acc);font:600 14px Sora,system-ui,sans-serif;padding:4px 0 14px;cursor:pointer}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;background:rgba(0,0,0,.94);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;max-width:150px;background:none;border:0;color:var(--mute);font:600 11px Sora,system-ui,sans-serif;padding:6px 4px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.nav button.on{color:var(--acc)}
.dist{text-align:center;margin:18px 0 0}
.dist .num{font-size:76px;line-height:1}
.dist span.u{font-size:18px;color:var(--mute);font-weight:600;margin-left:6px;letter-spacing:0}
.clk{text-align:center;color:var(--mute);font-size:20px;margin-top:6px}
.live{display:flex;justify-content:space-between;align-items:center}
.live i{width:8px;height:8px;border-radius:50%;background:var(--acc);display:inline-block}
.trk{position:relative;height:8px;border-radius:8px;background:var(--s2);margin:22px 8px 6px}
.trk i{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;transition:left .1s linear}
.trk .me{background:var(--acc);z-index:2}
.trk .gh{background:#fff}
.legend{display:flex;justify-content:center;gap:18px;font-size:12px;color:var(--mute);margin-bottom:10px}
.legend b{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.stop{display:block;width:78px;height:78px;border-radius:50%;border:3px solid var(--acc);background:transparent;margin:18px auto 6px;cursor:pointer;position:relative}
.stop::after{content:"";position:absolute;inset:0;margin:auto;width:24px;height:24px;border-radius:6px;background:var(--acc)}
.gap{font-weight:800}
.good{color:var(--good)}.bad{color:var(--bad)}
input[type=text]{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:400 16px Sora,system-ui,sans-serif}
input[type=range]{width:100%;accent-color:var(--acc)}
.res{text-align:center;margin:6px 0 4px}
.res .num{font-size:64px;line-height:1.05}
.res .u{font-size:18px;color:var(--mute);font-weight:600;margin-left:6px}
.res p{color:var(--mute);margin-top:8px}
.rt{display:block;width:100%;height:auto;filter:drop-shadow(0 0 6px rgba(255,107,26,.45))}.empty{text-align:center;padding:36px 0;color:var(--mute);font-size:13px}
.wrap{overflow-x:clip}.leaflet-container{background:#000;z-index:0;font:inherit}.leaflet-control-attribution{background:rgba(0,0,0,.7)!important;color:#8d8d8d!important;font-size:10px}.leaflet-control-attribution a{color:#ff6b1a!important}
.fld{display:block;margin-bottom:12px}.fld span{display:block;color:var(--mute);font-size:12px;margin-bottom:6px}input[type=number]{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:400 16px Sora,system-ui,sans-serif}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.mode{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:16px;border:1px solid var(--line);background:var(--s1);color:var(--ink);font:600 13px Sora,system-ui,sans-serif;cursor:pointer}.mode.on{border-color:var(--acc);color:var(--acc);background:#1b1004}.mode:focus-visible{outline:3px solid #fff;outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.alert{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}.ring circle.v{transition:stroke-dasharray .6s ease}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="nav" id="nav" aria-label="Principal"></nav>
<script>
var GOAL=20;
var DEF=[
 {id:0,nome:'Volta do Lago',park:'Parque das Águas',km:2.4,rank:[{n:'Rafa_Veloz',t:642},{n:'Carla.Run',t:675},{n:'Tiago da Pista',t:718},{n:'Mari Trota',t:750},{n:'Léo Vento',t:792}]},
 {id:1,nome:'Trilha do Bosque',park:'Parque das Águas',km:4.1,rank:[{n:'Carla.Run',t:1160},{n:'Bia Maratona',t:1205},{n:'Rafa_Veloz',t:1300},{n:'Dudu 10k',t:1350},{n:'Léo Vento',t:1450}]},
 {id:2,nome:'Circuito da Praça',park:'Praça do Sol',km:1.2,rank:[{n:'Mari Trota',t:310},{n:'Tiago da Pista',t:332},{n:'Bia Maratona',t:355},{n:'Dudu 10k',t:380},{n:'Rafa_Veloz',t:408}]}
];
var SEED=[{nome:'Volta do Lago',km:2.4,t:700,d:'Seg'},{nome:'Circuito da Praça',km:1.2,t:340,d:'Qua'},{nome:'Trilha do Bosque',km:4.1,t:1290,d:'Sex'}];
var DEMO=[318,312,320,308,300,305,296,290,298,292,286,294,288,284,290];
function clone(o){return JSON.parse(JSON.stringify(o))}
var S={nick:'Você',profile:null,routes:clone(DEF),view:'home',sel:0,arrived:false,week:{km:7.7,runs:3,ss:clone(SEED)}},R=null,T=null,run=null;
try{var j=localStorage.getItem('tr1');if(j){var d=JSON.parse(j);if(d.nick)S.nick=d.nick;if(d.routes)S.routes=d.routes;if(d.week)S.week=d.week;if(d.profile)S.profile=d.profile;if(d.lastMode)S.lastMode=d.lastMode}}catch(e){}
function save(){try{localStorage.setItem('tr1',JSON.stringify({nick:S.nick,routes:S.routes,week:S.week,profile:S.profile,lastMode:S.lastMode}))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function p2(n){return String(n).padStart(2,'0')}
function fmt(s){s=Math.round(s);if(s>=3600)return Math.floor(s/3600)+':'+p2(Math.floor(s%3600/60))+':'+p2(s%60);return p2(Math.floor(s/60))+':'+p2(s%60)}
function kmf(x){return x.toFixed(2).replace('.',',')}
function km1(x){return x.toFixed(1).replace('.',',')}
function cur(){return S.routes[S.sel]}
function ds(a,m){if(a.length<=m)return a.slice();var o=[];for(var i=0;i<m;i++)o.push(a[Math.round(i*(a.length-1)/(m-1))]);return o}
function crown(z){return'<svg width="'+z+'" height="'+z+'" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2 7l5 4 5-7 5 7 5-4-2 12H4z"/></svg>'}
function ico(p){return'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>'}
var LOGO='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9M9.5 2.5h5"/></svg>';
var PATHS=['M6 44C30 6 60 60 90 28S150 10 174 40','M6 30C26 56 50 8 78 30S126 56 150 22S170 18 174 26','M10 40C10 8 60 8 60 24S110 40 110 12S160 8 170 36'],ENDS=[[6,44,174,40],[6,30,174,26],[10,40,170,36]];
function pathSvg(i){var e=ENDS[i]||ENDS[0];return'<svg class="map" viewBox="0 0 180 52" aria-hidden="true"><path d="'+PATHS[i]+'" fill="none" stroke="#ff6b1a" stroke-width="3" stroke-linecap="round"/><circle cx="'+e[0]+'" cy="'+e[1]+'" r="4.5" fill="#fff"/><circle cx="'+e[2]+'" cy="'+e[3]+'" r="4.5" fill="#ff6b1a"/></svg>'}
function chartSvg(a){
 var n=a.length,mn=Math.min.apply(null,a),mx=Math.max.apply(null,a);if(mx-mn<8){mx+=4;mn-=4}
 var P=a.map(function(v,i){return[i/(n-1)*300,14+(v-mn)/(mx-mn)*70]});
 var d='M'+P[0][0].toFixed(1)+' '+P[0][1].toFixed(1);
 for(var i=1;i<n;i++){d+=' Q'+P[i-1][0].toFixed(1)+' '+P[i-1][1].toFixed(1)+' '+((P[i-1][0]+P[i][0])/2).toFixed(1)+' '+((P[i-1][1]+P[i][1])/2).toFixed(1)}
 d+=' L'+P[n-1][0].toFixed(1)+' '+P[n-1][1].toFixed(1);
 return'<svg class="chart" viewBox="0 0 300 100" role="img" aria-label="Gráfico de ritmo"><defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b1a" stop-opacity=".35"/><stop offset="1" stop-color="#ff6b1a" stop-opacity="0"/></linearGradient></defs><path d="M0 25H300M0 50H300M0 75H300" stroke="#2a2a2a" stroke-width="1"/><path d="'+d+' L300 100 L0 100Z" fill="url(#gr)"/><path d="'+d+'" fill="none" stroke="#ff6b1a" stroke-width="2.5" stroke-linecap="round" style="filter:drop-shadow(0 0 5px rgba(255,107,26,.6))"/></svg>'}
function hall(r,n){return r.rank.slice(0,n||5).map(function(x,i){return'<div class="rw'+(i===0?' k':'')+(x.eu?' me':'')+'"><span class="pos">'+(i===0?crown(14):i+1)+'</span><span class="nm">'+esc(x.n)+'</span><span class="tm">'+fmt(x.t)+'</span></div>'}).join('')}
function go(v,id){if(id!==undefined)S.sel=id;S.view=v;render();window.scrollTo(0,0)}
function arrive(){S.arrived=true;render()}
function nav(){var n=$('nav');if(S.view==='run'||S.view==='gps'||S.view==='signup'){n.style.display='none';return}n.style.display='flex';
 var it=[['home','Início',ico('<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>')],['routes','Percursos',ico('<path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>')],['tips','Dicas',ico('<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/>')],['profile','Perfil',ico('<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/>')]];
 n.innerHTML=it.map(function(x){var on=S.view===x[0]||(x[0]==='routes'&&(S.view==='detail'||S.view==='result'));return'<button class="'+(on?'on':'')+'" onclick="go(\''+x[0]+'\')"'+(on?' aria-current="page"':'')+'>'+x[2]+x[1]+'</button>'}).join('')}
function home(){
 var w=S.week,pct=Math.min(100,Math.round(w.km/GOAL*100)),C=2*Math.PI*38,mine=S.routes.filter(function(r){return r.rank[0].eu}).length,last=w.ss[0],hoje=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
 var h='<div class="brand"><span class="logo">'+LOGO+'</span><div><b>Tracking Runners</b><small>Esteja entre os melhores</small></div></div>';
 h+='<div class="hd"><small>'+esc(hoje)+'</small><h1>Olá, '+esc(S.nick)+'</h1></div>';
 if(S.arrived)h+='<div class="card hi alert"><b>Você chegou ao Parque das Águas</b><p class="lbl" style="margin-top:4px">É a sua primeira vez aqui. Outras pessoas já correram 2 percursos neste parque. Veja o tempo a bater.</p><button class="btn" onclick="go(\'routes\')">Ver percursos do parque</button></div>';
 h+='<div class="card goal"><div class="ring"><svg width="92" height="92" viewBox="0 0 92 92"><circle cx="46" cy="46" r="38" fill="none" stroke="#2a2a2a" stroke-width="8"/><circle class="v" cx="46" cy="46" r="38" fill="none" stroke="#ff6b1a" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+(C*pct/100).toFixed(1)+' '+C.toFixed(1)+'"/></svg><b>'+pct+'%</b></div><div class="info"><div class="lbl">Meta da semana</div><div class="num big">'+km1(w.km)+'<span>de '+GOAL+' km</span></div><div class="ok">'+(pct>=100?'Meta batida!':pct>=40?'Você está no ritmo!':'Falta pouco para engatar.')+'</div></div></div>';
 h+='<div class="card hi"><h3 style="font-size:15px">Gravar treino com GPS</h3><p class="lbl" style="margin-top:4px">Escolha corrida, caminhada ou bike, grave o trajeto e dispute o recorde do percurso.</p><button class="btn" onclick="gpsFree()">Gravar treino com GPS</button></div>';h+='<div class="grid2"><div class="tile"><div class="lbl">Treinos na semana</div><div class="num v">'+w.runs+'</div></div><div class="tile o"><div class="lbl">Recordes seus</div><div class="num v">'+mine+'<i>percursos</i></div></div></div>';
 h+=nearbyHtml();h+='<div class="sec"><h2>Último treino</h2><span>'+esc(last.d)+'</span></div><div class="card"><div class="top2"><h3>'+esc(last.nome)+'</h3></div>'+(last.pts&&last.pts.length>1?routeSvg(last.pts):chartSvg(last.s&&last.s.length>1?last.s:DEMO))+'<div class="stats3"><div><div class="lbl">Distância</div><div class="v">'+kmf(last.km)+'</div></div><div><div class="lbl">Tempo</div><div class="v">'+fmt(last.t)+'</div></div><div><div class="lbl">'+spdLbl(last.mode)+'</div><div class="v">'+spdTxt(last.km*1000,last.t,last.mode)+'</div></div></div></div>';
 h+='<div class="sec"><h2>Sessões recentes</h2><span>'+Math.min(3,w.ss.length)+' de '+w.ss.length+'</span></div><div class="card">'+w.ss.slice(0,3).map(function(x){return'<div class="rw"><div class="nm">'+esc(x.nome)+'<div class="lbl">'+(x.mode?MODES[x.mode].nome+' · ':'')+kmf(x.km)+' km · '+esc(x.d)+'</div></div><span class="tm">'+fmt(x.t)+'</span></div>'}).join('')+'</div>';
 if(!S.arrived)h+='<div class="card"><h3 style="font-size:15px">Teste a sugestão por localização</h3><p class="lbl" style="margin-top:4px">No app real, o aviso chega sozinho quando você entra num parque novo. Aqui, simule a chegada.</p><button class="btn g" onclick="arrive()">Simular chegada ao Parque das Águas</button></div>';
 h+='<div class="cta"><button class="btn" onclick="go(\'routes\')">Ver percursos</button></div>';
 return h}
function routes(){
 var h='<div class="hd"><h1>Percursos</h1></div>';h+='<div class="card"><h3 style="font-size:15px">Criar um percurso novo</h3><p class="lbl" style="margin:4px 0 0">Grave um treino com GPS e salve como percurso. O primeiro tempo vira o recorde a bater.</p><button class="btn" onclick="gpsFree()">Gravar para criar</button></div>';
 if(S.arrived)h+='<div class="card hi alert"><b>Percursos perto de você</b><p class="lbl" style="margin-top:4px">Parque das Águas, primeira visita.</p></div>';
 var list=S.routes.slice();if(S.arrived)list.sort(function(a,b){return(b.park==='Parque das Águas')-(a.park==='Parque das Águas')});
 return h+list.map(function(r){var k=r.rank[0];return'<div class="card"><div class="top2"><div><h3>'+esc(r.nome)+'</h3><div class="lbl">'+esc(r.park)+'</div></div><span class="pill">'+MODES[mdOf(r)].nome+' · '+km1(r.km)+' km</span></div>'+routeThumb(r)+'<div class="king">'+crown(16)+esc(k.n)+'<span class="tm">'+fmt(k.t)+'</span></div><button class="btn g" onclick="go(\'detail\','+r.id+')">Ver Hall da Fama</button></div>'}).join('')}
function detail(){
 var r=cur(),me=r.rank.find(function(x){return x.eu});

function gpsValid(rt,pts,m,md){

function geoName(pts,m,cb){
 var a=pts[0],b=pts[pts.length-1];
 function q(p,f){
  fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=17&accept-language=pt-BR&lat='+p[0]+'&lon='+p[1])
   .then(function(r){return r.json()}).then(function(j){f(j&&j.address?j.address:null)}).catch(function(){f(null)})}
 function place(x){return x.leisure||x.park||x.road||x.pedestrian||x.footway||x.path||x.neighbourhood||x.suburb||''}
 function area(x){return x.suburb||x.neighbourhood||x.city_district||x.town||x.village||x.city||''}
 function fin(n,x){if(!n){cb(null);return}var ar=area(x);cb(n+(ar&&ar!==n?' · '+ar:'')+' · '+km1(m/1000)+' km')}
 q(a,function(A){
  if(!A){cb(null);return}
  var pa=place(A);
  if(hav({la:a[0],lo:a[1]},{la:b[0],lo:b[1]})<100){fin(pa?'Circuito '+pa:'',A);return}
  setTimeout(function(){q(b,function(B){
   var pb=B?place(B):'';
   if(pa&&pb&&pa!==pb)fin(pa+' até '+pb,A);else if(pa)fin('Trecho '+pa,A);else fin('',A)})},1100)})}

 var o='';
 if(isNew)o+='<div class="brand"><span class="logo">'+LOGO+'</span><div><b>Tracking Runners</b><small>Esteja entre os melhores</small></div></div>';
 o+='<div class="hd"><h1>'+(isNew?'Crie seu perfil':'Perfil')+'</h1>'+(isNew?'<p class="lbl" style="margin-top:6px">Usamos esses dados para calcular suas calorias e sugerir percursos perto de você.</p>':'')+'</div>';
 o+='<div class="card"><label class="fld"><span>Nome (aparece no ranking; pode ser um apelido)</span><input type="text" id="pn" maxlength="24" autocomplete="name" value="'+esc(p.nome||'')+'"></label>';
 o+='<div class="grid2" style="margin:0 0 12px"><label class="fld" style="margin:0"><span>Peso (kg)</span><input type="number" id="pp" inputmode="decimal" step="0.1" min="30" max="250" value="'+(p.peso||'')+'"></label><label class="fld" style="margin:0"><span>Altura (cm)</span><input type="number" id="pa" inputmode="numeric" min="100" max="230" value="'+(p.altura||'')+'"></label></div>';
 o+='<label class="fld"><span>Onde você se exercita (bairro e cidade)</span><input type="text" id="pl" maxlength="60" oninput="SIGN.lat=null" value="'+esc(p.local||'')+'"></label>';
 o+='<button class="btn g" style="margin:0 0 4px" onclick="locFill()">Usar minha localização atual</button><p class="lbl" id="pe" style="color:var(--bad);margin:8px 0 0;min-height:18px"></p><button class="btn" onclick="saveProfile()">Salvar perfil</button><p class="lbl" style="margin-top:10px">Peso, altura e local ficam só neste aparelho. Só o nome aparece no Hall da Fama.</p></div>';
 return o}
function signupView(){return profileForm(true)}
function profileView(){return profileForm(false)+'<div class="card"><h3 style="font-size:15px">Demonstração</h3><p class="lbl" style="margin-top:4px">Apaga seus recordes e treinos e volta ao estado inicial. O perfil é mantido.</p><button class="btn g" onclick="resetAll()">Reiniciar demonstração</button></div>'}
function locFill(){
 var e=$('pe');if(!navigator.geolocation){e.textContent='Este navegador não tem GPS.';return}
 e.style.color='var(--mute)';e.textContent='Buscando sua localização…';
 navigator.geolocation.getCurrentPosition(function(p){
  SIGN.lat=p.coords.latitude;SIGN.lon=p.coords.longitude;
  fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=14&accept-language=pt-BR&lat='+SIGN.lat+'&lon='+SIGN.lon)
   .then(function(r){return r.json()}).then(function(j){
    var a=j.address||{},n=[a.suburb||a.neighbourhood||a.city_district,a.city||a.town||a.village].filter(Boolean).join(', ');
    $('pl').value=n||'Minha localização atual';e.textContent=''})
   .catch(function(){$('pl').value='Minha localização atual';e.textContent=''})
 },function(){e.style.color='var(--bad)';e.textContent='Não consegui a localização. Digite o bairro e a cidade.'},{enableHighAccuracy:false,timeout:15000})}
function saveProfile(){
 var e=$('pe'),n=$('pn').value.trim(),w=parseFloat(String($('pp').value).replace(',','.')),a=parseFloat(String($('pa').value).replace(',','.')),l=$('pl').value.trim();
 e.style.color='var(--bad)';
 if(!n){e.textContent='Informe o seu nome.';return}
 if(!(w>=30&&w<=250)){e.textContent='Informe um peso entre 30 e 250 kg.';return}
 if(!(a>=100&&a<=230)){e.textContent='Informe uma altura entre 100 e 230 cm.';return}
 if(!l){e.textContent='Informe onde você se exercita (bairro e cidade).';return}
 e.style.color='var(--mute)';e.textContent='Salvando…';
 function fin(){
  S.routes.forEach(function(r){r.rank.forEach(function(x){if(x.eu)x.n=n})});
  S.nick=n;S.profile={nome:n,peso:w,altura:a,local:l,lat:SIGN.lat,lon:SIGN.lon};save();go('home')}
 if(SIGN.lat!=null){fin();return}
 fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=pt-BR&q='+encodeURIComponent(l))
  .then(function(r){return r.json()}).then(function(j){if(j&&j[0]){SIGN.lat=parseFloat(j[0].lat);SIGN.lon=parseFloat(j[0].lon)}fin()})
  .catch(function(){fin()})}
function nearbyHtml(){
 var p=S.profile,o='<div class="sec"><h2>Percursos perto de você</h2><span>'+esc(p?p.local:'')+'</span></div>';
 if(!p||p.lat==null)return o+'<div class="card"><p class="lbl">Não encontramos o seu local no mapa. Abra o Perfil e toque em Usar minha localização atual.</p></div>';
 var near=S.routes.filter(function(r){return r.pts&&r.pts.length>1}).map(function(r){return{r:r,d:hav({la:p.lat,lo:p.lon},{la:r.pts[0][0],lo:r.pts[0][1]})}}).sort(function(a,b){return a.d-b.d}).slice(0,3);
 if(!near.length)return o+'<div class="card"><p class="lbl">Ainda não há percursos salvos perto de você. Grave o primeiro com GPS. Por enquanto, a lista mostra só os percursos salvos neste aparelho.</p></div>';
 return o+near.map(function(x){
  var r=x.r,k=r.rank[0],dist=x.d<1000?Math.round(x.d)+' m':(x.d/1000).toFixed(1).replace('.',',')+' km';
  return'<div class="card"><h3>'+esc(r.nome)+'</h3><div class="lbl">'+MODES[mdOf(r)].nome+' · a '+dist+' do seu local</div><div class="king">'+crown(16)+esc(k.n)+'<span class="tm">'+fmt(k.t)+'</span></div><button class="btn g" onclick="go(\'detail\','+r.id+')">Ver Hall da Fama</button></div>'}).join('')}
var WARM=['Caminhe ou trote leve por 5 a 10 minutos antes de acelerar.','Faça 10 círculos de tornozelo e de quadril em cada perna.','Faça 10 elevações de joelho e 10 chutes de calcanhar ao glúteo, devagar.'];
var STRETCH=[['Quadríceps','Em pé, segure o pé atrás e leve o calcanhar ao glúteo. 30 s em cada perna.'],['Posterior de coxa','Sentado, estenda uma perna e incline o tronco com as costas retas. 30 s em cada perna.'],['Panturrilha','Mãos na parede, uma perna esticada atrás com o calcanhar no chão. 30 s em cada perna.'],['Glúteos','Deitado, cruze o tornozelo sobre o joelho oposto e puxe a coxa. 30 s de cada lado.'],['Flexores do quadril','Em afundo, leve o quadril à frente até sentir a frente da coxa. 30 s de cada lado.']];
var STRONG=[['Agachamento','3 séries de 12, duas a três vezes por semana.'],['Ponte de glúteos','3 séries de 15.'],['Elevação de panturrilha','3 séries de 15, na borda de um degrau.'],['Prancha','3 séries de 30 s.']];
function tipRows(a){return a.map(function(x){return'<div class="rw"><div class="nm">'+x[0]+'<div class="lbl">'+x[1]+'</div></div></div>'}).join('')}
function warmCard(){return'<div class="card"><h3 style="font-size:15px">Aquecimento rápido</h3>'+warmList().map(function(t){return'<p class="lbl" style="margin-top:6px">'+t+'</p>'}).join('')+'<button class="btn g" onclick="go(\'tips\')">Ver todas as dicas</button></div>'}
function stretchCard(){return'<div class="card" style="margin-top:12px"><h3 style="font-size:15px">Alongue agora</h3><p class="lbl" style="margin:4px 0 8px">Cinco minutos ajudam a recuperar os músculos.</p>'+tipRows(STRETCH.slice(0,3))+'<button class="btn g" onclick="go(\'tips\')">Ver todas as dicas</button></div>'}
function tipsView(){
 return'<div class="hd"><h1>Dicas</h1><p class="lbl" style="margin-top:6px">Orientações gerais para correr com menos risco de lesão. Não substituem a avaliação de um médico ou educador físico.</p></div>'
 +'<div class="card"><h3 style="font-size:15px;margin-bottom:6px">Por modalidade</h3>'+tipRows(MODETIPS)+'</div>'+'<div class="card"><h3 style="font-size:15px">Antes de treinar</h3>'+warmList().map(function(t){return'<p class="lbl" style="margin-top:6px">'+t+'</p>'}).join('')+'</div>'
 +'<div class="card"><h3 style="font-size:15px;margin-bottom:6px">Depois de treinar</h3>'+tipRows(STRETCH)+'</div>'
 +'<div class="card"><h3 style="font-size:15px;margin-bottom:6px">Fortalecimento</h3>'+tipRows(STRONG)+'</div>'
 +'<div class="card"><h3 style="font-size:15px;margin-bottom:6px">Para evitar lesões</h3>'
 +tipRows([['Aumente aos poucos','Evite saltos grandes de distância de uma semana para outra.'],['Descanse','Alterne dias de corrida com dias leves ou de descanso.'],['Hidrate-se','Beba água antes, durante e depois do treino.'],['Tênis adequado','Troque quando o solado estiver gasto.'],['Sinais de alerta','Pare se sentir dor aguda, formigamento ou dor que piora enquanto corre. Se a dor durar dias, procure um médico ou fisioterapeuta.']])+'</div>'}

var MODES={
 corrida:{nome:'Corrida',v:12,k:1.0,ic:'<circle cx="15" cy="4" r="2"/><path d="M13 8l-3 3 3 3-1 5M13 8l3 3 3 1M10 11l-3 1"/>'},
 caminhada:{nome:'Caminhada',v:6,k:0.6,ic:'<circle cx="12" cy="4" r="2"/><path d="M12 8v6l-2 6M12 14l3 6M9 10l3-2 3 2"/>'},
 bike:{nome:'Bike',v:25,k:0.4,ic:'<circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-7h5l3 7M10 9l-1-2h-2M12 12.5h4"/>'}
};
function mdOf(x){return x&&MODES[x.mode]?x.mode:'corrida'}
function spdTxt(m,t,md){
 if(md==='bike')return t>0&&m>20?(m/t*3.6).toFixed(1).replace('.',','):'--';
 return m>20?fmt(t/(m/1000)):'--:--'}
function spdLbl(md){return md==='bike'?'Velocidade km/h':'Ritmo /km'}
function spdUnit(md){return md==='bike'?'km/h':'/km'}
function setMode(k){G.mode=k;S.lastMode=k;save();render()}
function modeSel(){
 if(G.route)return'<div class="live" style="margin-bottom:12px"><span class="lbl">Modalidade do percurso</span><span class="pill">'+MODES[mdOf(G.route)].nome+'</span></div>';
 return'<div class="lbl" style="margin:0 2px 8px">Escolha a modalidade</div><div class="grid3">'+Object.keys(MODES).map(function(k){
  var on=G.mode===k;
  return'<button class="mode'+(on?' on':'')+'" aria-pressed="'+on+'" onclick="setMode(\''+k+'\')">'+ico(MODES[k].ic)+MODES[k].nome+'</button>'}).join('')+'</div>'}
var WB=['Confira freios, pneus e capacete antes de sair.','Pedale leve por 10 minutos antes de aumentar o esforço.','Faça 10 círculos de tornozelo e de quadril em cada perna.'];
var WC=['Caminhe em passo leve por 5 minutos antes de acelerar.','Faça 10 círculos de tornozelo e de quadril em cada perna.','Faça 10 elevações de joelho, devagar.'];
function warmList(){return G.mode==='bike'?WB:G.mode==='caminhada'?WC:WARM}
var MODETIPS=[['Corrida','Pise leve, com passos curtos e frequentes. Alterne treinos fortes com treinos leves.'],['Caminhada','Mantenha a postura ereta e o olhar à frente. Use tênis com amortecimento e boa aderência.'],['Bike','Use capacete e luzes, e respeite a sinalização. Ajuste o selim para o joelho ficar levemente dobrado no ponto mais baixo do pedal. Alterne a posição das mãos para aliviar punhos e ombros.']];
function render(){
 clearInterval(T);
 if(!S.profile&&S.view!=='signup')S.view='signup';var v={home:home,routes:routes,detail:detail,run:runView,result:result,profile:profileView,gps:gpsView,gpsdone:gpsDone,tips:tipsView,signup:signupView}[S.view];
 if(M){M.remove();M=null}$('app').innerHTML=v();nav();mountMaps();if(S.view==='gpsdone')nameRoute();
 if(S.view==='run')startRun()}
render();
</script>
